spring.application.name=salary-management
server.port=${PORT:8080}

# Seed configuration
app.seed.enabled=${APP_SEED_ENABLED:false}
app.seed.employee-count=${APP_SEED_EMPLOYEE_COUNT:10000}

# CORS
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:4200}

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:salary_management}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver
# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true